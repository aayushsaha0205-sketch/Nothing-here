name: Inspect Legendary Monuments JAR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect JAR without changing it
        shell: bash
        run: |
          set -euo pipefail
          JAR="LegendaryMonuments-8.2-LumyMon-FINAL-AUDITED-1.0.4.jar"
          test -f "$JAR" || { echo "JAR not found: $JAR"; exit 1; }
          mkdir -p audit
          {
            echo "JAR: $JAR"
            echo "Bytes: $(stat -c%s "$JAR")"
            echo
            echo "=== SHA-256 ==="
            sha256sum "$JAR"
            echo
            echo "=== Archive integrity ==="
            unzip -t "$JAR"
            echo
            echo "=== Archive entries ==="
            unzip -Z1 "$JAR"
          } > audit/archive-report.txt

          python3 - <<'PY'
          import json, zipfile, pathlib
          jar = pathlib.Path("LegendaryMonuments-8.2-LumyMon-FINAL-AUDITED-1.0.4.jar")
          out = pathlib.Path("audit/metadata-report.txt")
          with zipfile.ZipFile(jar) as z, out.open("w", encoding="utf-8") as f:
              names = z.namelist()
              candidates = [n for n in names if n.endswith(("fabric.mod.json", "quilt.mod.json", "mods.toml", "neoforge.mods.toml"))]
              candidates += [n for n in names if n.lower().endswith(".json") and any(k in n.lower() for k in ("config", "legendary", "lumymon", "cobblemon")) and n not in candidates]
              for name in candidates:
                  f.write(f"\n===== {name} =====\n")
                  try:
                      raw = z.read(name)
                      if name.endswith(".json"):
                          try:
                              f.write(json.dumps(json.loads(raw), indent=2, ensure_ascii=False))
                          except Exception:
                              f.write(raw.decode("utf-8", "replace"))
                      else:
                          f.write(raw.decode("utf-8", "replace"))
                  except Exception as e:
                      f.write(f"[READ ERROR: {e}]")
                  f.write("\n")
          PY

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: legendary-monuments-audit
          path: audit/
          if-no-files-found: error
